[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veriducta"
version = "0.1.0"
description = "RAG pipeline observability — causal root-cause attribution for answer failures"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Pydantic v2
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Observability
    "structlog>=24.4.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.21.0",
    # HTTP client
    "httpx>=0.27.0",
    # Storage clients
    "qdrant-client>=1.12.0",
    "boto3>=1.35.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    # Phase 3 — Generation & Verification
    "anthropic>=0.40.0",
    # Phase 1 — Ingestion pipeline
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "networkx>=3.3",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    # Mypy stubs
    "types-boto3>=1.35.0",
    "boto3-stubs[s3]>=1.35.0",
]

[project.scripts]
veriducta = "api.app:main"

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "config",
    "core",
    "storage",
    "schemas",
    "models",
    "utils",
    "ingestion",
    "retrieval",
    "generation",
    "verification",
    "replay",
    "evaluation",
    "observability",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
    "ANN", # flake8-annotations
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",   # use of assert (needed in tests)
    "ANN401", # Any is legitimate in serialisers, interfaces, and JSON helpers
    "UP047",  # TypeVar decorator pattern predates PEP 695; update in Phase 1+
    "S104",   # binding 0.0.0.0 is intentional for containerised deployments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]
"scripts/**" = ["ANN"]
# Seed data files contain long natural-language strings (questions, answers, descriptions)
# that cannot be meaningfully shortened without degrading data quality.
"evaluation/golden.py" = ["E501"]
"evaluation/corruptions.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "api", "config", "core", "storage", "schemas",
    "models", "utils", "ingestion", "retrieval",
    "generation", "verification", "replay", "evaluation", "observability",
]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
target-version = ["py312"]
line-length = 100

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "fitz.*",
    "pdfplumber.*",
    "networkx.*",
    "rank_bm25.*",
    "sentence_transformers.*",
    "jsonschema.*",
    "structlog.*",
    "qdrant_client.*",
    "orjson.*",
    "minio.*",
    "anthropic.*",
    "ragas.*",
    "datasets.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
    "-v",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    # StarletteDeprecationWarning is UserWarning subclass, triggered by httpx + starlette TestClient
    # version incompatibility — irrelevant to application correctness.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "scripts/*",
    "docs/*",
    "htmlcov/*",
    ".venv/*",
    "*/conftest.py",
    # Abstract interfaces — no executable lines
    "core/interfaces.py",
    # Observability requires live OTLP/Prometheus infrastructure
    "observability/tracing.py",
    "observability/metrics.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
