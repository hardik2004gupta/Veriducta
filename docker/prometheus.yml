global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "veriducta"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: "otel-collector-exported"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics
