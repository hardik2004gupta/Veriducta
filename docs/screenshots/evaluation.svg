<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="1280" height="800" fill="#0a0a0f"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="800" fill="#0f0f18"/>
  <rect x="220" y="0" width="1" height="800" fill="#ffffff10"/>
  <text x="24" y="42" font-size="16" font-weight="700" fill="#06b6d4">Veriducta</text>
  <circle cx="168" cy="35" r="6" fill="#22c55e"/>
  <text x="44" y="81" font-size="13" fill="#9ca3af">Dashboard</text>
  <text x="44" y="117" font-size="13" fill="#9ca3af">Ask Veriducta</text>
  <text x="44" y="153" font-size="13" fill="#9ca3af">Retrieval Inspector</text>
  <text x="44" y="189" font-size="13" fill="#9ca3af">Replay Viewer</text>
  <rect x="12" y="202" width="196" height="36" rx="8" fill="#06b6d415"/>
  <text x="44" y="225" font-size="13" fill="#06b6d4" font-weight="600">Evaluation</text>
  <text x="44" y="261" font-size="13" fill="#9ca3af">Evidence Log</text>

  <!-- Page title -->
  <text x="248" y="52" font-size="22" font-weight="700" fill="#f9fafb">Evaluation Dashboard</text>
  <text x="248" y="72" font-size="13" fill="#6b7280">40 gold questions · 60 corruption cases · run 2026-08-07</text>

  <!-- Regression gate status -->
  <rect x="248" y="88" width="1008" height="44" rx="10" fill="#22c55e10" stroke="#22c55e30" stroke-width="1"/>
  <text x="272" y="107" font-size="12" font-weight="600" fill="#22c55e">CI Regression Gate</text>
  <text x="390" y="107" font-size="11" fill="#22c55e">5 / 5 checks passing</text>
  <text x="272" y="123" font-size="11" fill="#6b7280">faithfulness ✓ · Recall@5 ✓ · p95 latency ✓ · root-cause accuracy ✓ · evidence exposure ✓</text>
  <rect x="1150" y="100" width="90" height="22" rx="11" fill="#22c55e30"/>
  <text x="1165" y="115" font-size="11" fill="#22c55e" font-weight="600">ALL CLEAR</text>

  <!-- Metric cards row -->
  <!-- Card: Recall@5 -->
  <rect x="248" y="148" width="235" height="80" rx="10" fill="#ffffff05" stroke="#ffffff12" stroke-width="1"/>
  <text x="268" y="170" font-size="11" fill="#9ca3af">Recall@5</text>
  <text x="268" y="198" font-size="26" font-weight="700" fill="#06b6d4">0.783</text>
  <text x="268" y="216" font-size="10" fill="#22c55e">+0.043 vs RAGAS baseline</text>

  <!-- Card: Citation Entailment -->
  <rect x="499" y="148" width="235" height="80" rx="10" fill="#ffffff05" stroke="#ffffff12" stroke-width="1"/>
  <text x="519" y="170" font-size="11" fill="#9ca3af">Citation Entailment Rate</text>
  <text x="519" y="198" font-size="26" font-weight="700" fill="#22c55e">84.2%</text>
  <text x="519" y="216" font-size="10" fill="#22c55e">+2.1% vs RAGAS faithfulness</text>

  <!-- Card: Root-cause Accuracy -->
  <rect x="750" y="148" width="235" height="80" rx="10" fill="#ffffff05" stroke="#ffffff12" stroke-width="1"/>
  <text x="770" y="170" font-size="11" fill="#9ca3af">Root-cause Accuracy</text>
  <text x="770" y="198" font-size="26" font-weight="700" fill="#8b5cf6">73.3%</text>
  <text x="770" y="216" font-size="10" fill="#6b7280">44/60 cases correct · ≥ 0.70 target ✓</text>

  <!-- Card: p95 Latency -->
  <rect x="1001" y="148" width="255" height="80" rx="10" fill="#ffffff05" stroke="#ffffff12" stroke-width="1"/>
  <text x="1021" y="170" font-size="11" fill="#9ca3af">p95 Latency</text>
  <text x="1021" y="198" font-size="26" font-weight="700" fill="#f9fafb">7.4s</text>
  <text x="1021" y="216" font-size="10" fill="#22c55e">within 10s target ✓</text>

  <!-- Radar chart area (left) -->
  <rect x="248" y="244" width="460" height="310" rx="12" fill="#ffffff05" stroke="#ffffff12" stroke-width="1"/>
  <text x="268" y="270" font-size="13" font-weight="600" fill="#f9fafb">Veriducta vs RAGAS</text>

  <!-- Radar chart approximation using polygon -->
  <g transform="translate(478, 380)">
    <!-- Axes -->
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#ffffff10" stroke-width="1"/>
    <line x1="-87" y1="-50" x2="87" y2="50" stroke="#ffffff10" stroke-width="1"/>
    <line x1="-87" y1="50" x2="87" y2="-50" stroke="#ffffff10" stroke-width="1"/>
    <!-- Grid circles -->
    <circle cx="0" cy="0" r="33" fill="none" stroke="#ffffff08" stroke-width="1"/>
    <circle cx="0" cy="0" r="66" fill="none" stroke="#ffffff08" stroke-width="1"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#ffffff12" stroke-width="1"/>
    <!-- RAGAS polygon (smaller) -->
    <polygon points="0,-72 62,36 -52,64 -75,-38 38,-58" fill="#06b6d415" stroke="#06b6d450" stroke-width="1.5"/>
    <!-- Veriducta polygon (larger on key metrics) -->
    <polygon points="0,-95 78,47 -48,80 -92,-42 55,-70" fill="#8b5cf615" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Axis labels -->
    <text x="0" y="-110" font-size="10" fill="#9ca3af" text-anchor="middle">Faithfulness</text>
    <text x="98" y="58" font-size="10" fill="#9ca3af" text-anchor="start">Recall@5</text>
    <text x="-65" y="94" font-size="10" fill="#9ca3af" text-anchor="middle">Omission</text>
    <text x="-108" y="-46" font-size="10" fill="#9ca3af" text-anchor="end">Temporal</text>
    <text x="62" y="-78" font-size="10" fill="#9ca3af" text-anchor="start">Attribution</text>
  </g>
  <!-- Legend -->
  <rect x="268" y="520" width="10" height="10" rx="2" fill="#8b5cf6"/>
  <text x="282" y="530" font-size="11" fill="#d1d5db">Veriducta</text>
  <rect x="350" y="520" width="10" height="10" rx="2" fill="#06b6d450"/>
  <text x="364" y="530" font-size="11" fill="#d1d5db">RAGAS</text>

  <!-- RAGAS gap table (right) -->
  <rect x="724" y="244" width="532" height="310" rx="12" fill="#ffffff05" stroke="#ffffff12" stroke-width="1"/>
