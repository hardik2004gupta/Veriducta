  <text x="744" y="298" font-size="11" fill="#6b7280" font-weight="600">METRIC</text>
  <text x="1010" y="298" font-size="11" fill="#6b7280" font-weight="600">SCORE</text>
  <text x="1110" y="298" font-size="11" fill="#6b7280" font-weight="600">RAGAS</text>

  <!-- Row 1 -->
  <line x1="724" y1="308" x2="1256" y2="308" stroke="#ffffff08" stroke-width="1"/>
  <text x="744" y="328" font-size="12" fill="#d1d5db">Causal attribution accuracy</text>
  <text x="1010" y="328" font-size="12" fill="#22c55e" font-weight="600">0.733</text>
  <text x="1110" y="328" font-size="12" fill="#6b7280">✗ N/A</text>

  <!-- Row 2 -->
  <line x1="724" y1="340" x2="1256" y2="340" stroke="#ffffff08" stroke-width="1"/>
  <text x="744" y="360" font-size="12" fill="#d1d5db">Omission rate</text>
  <text x="1010" y="360" font-size="12" fill="#22c55e" font-weight="600">8.3%</text>
  <text x="1110" y="360" font-size="12" fill="#6b7280">✗ N/A</text>

  <!-- Row 3 -->
  <line x1="724" y1="372" x2="1256" y2="372" stroke="#ffffff08" stroke-width="1"/>
  <text x="744" y="392" font-size="12" fill="#d1d5db">Temporal-valid retrieval rate</text>
  <text x="1010" y="392" font-size="12" fill="#22c55e" font-weight="600">94.1%</text>
  <text x="1110" y="392" font-size="12" fill="#6b7280">✗ N/A</text>

  <!-- Row 4 -->
  <line x1="724" y1="404" x2="1256" y2="404" stroke="#ffffff08" stroke-width="1"/>
  <text x="744" y="424" font-size="12" fill="#d1d5db">Contradiction acknowledgment rate</text>
  <text x="1010" y="424" font-size="12" fill="#22c55e" font-weight="600">91.7%</text>
  <text x="1110" y="424" font-size="12" fill="#6b7280">✗ N/A</text>

  <!-- Row divider -->
  <line x1="724" y1="436" x2="1256" y2="436" stroke="#ffffff15" stroke-width="1"/>
  <text x="744" y="458" font-size="11" fill="#6b7280">For comparison — metrics both tools compute:</text>

  <!-- Row 5 -->
  <line x1="724" y1="468" x2="1256" y2="468" stroke="#ffffff08" stroke-width="1"/>
  <text x="744" y="488" font-size="12" fill="#d1d5db">Faithfulness (citation entailment)</text>
  <text x="1010" y="488" font-size="12" fill="#06b6d4" font-weight="600">0.842</text>
  <rect x="1090" y="476" width="50" height="18" rx="4" fill="#06b6d415"/>
  <text x="1100" y="488" font-size="12" fill="#06b6d4">0.821</text>

  <!-- Row 6 -->
  <line x1="724" y1="500" x2="1256" y2="500" stroke="#ffffff08" stroke-width="1"/>
  <text x="744" y="520" font-size="12" fill="#d1d5db">Answer relevance</text>
  <text x="1010" y="520" font-size="12" fill="#06b6d4" font-weight="600">0.891</text>
  <rect x="1090" y="508" width="50" height="18" rx="4" fill="#06b6d415"/>
  <text x="1100" y="520" font-size="12" fill="#06b6d4">0.878</text>

  <!-- Benchmark breakdown -->
  <rect x="248" y="568" width="1008" height="196" rx="12" fill="#ffffff05" stroke="#ffffff12" stroke-width="1"/>
  <text x="268" y="594" font-size="13" font-weight="600" fill="#f9fafb">Corruption Benchmark Breakdown (60 cases)</text>

  <!-- Breakdown bars -->
  <!-- Retrieval corruptions: 20 cases, 17 correct = 85% -->
  <text x="268" y="622" font-size="11" fill="#9ca3af">Retrieval (20 cases)</text>
  <rect x="400" y="610" width="300" height="18" rx="9" fill="#ffffff08"/>
  <rect x="400" y="610" width="255" height="18" rx="9" fill="#06b6d4"/>
  <text x="712" y="623" font-size="11" fill="#06b6d4">85%</text>

  <!-- Chunking corruptions: 15 cases, 11 correct = 73% -->
  <text x="268" y="656" font-size="11" fill="#9ca3af">Chunking (15 cases)</text>
  <rect x="400" y="644" width="300" height="18" rx="9" fill="#ffffff08"/>
  <rect x="400" y="644" width="219" height="18" rx="9" fill="#8b5cf6"/>
  <text x="712" y="657" font-size="11" fill="#8b5cf6">73%</text>

  <!-- Reranker corruptions: 15 cases, 11 correct = 73% -->
  <text x="268" y="690" font-size="11" fill="#9ca3af">Reranker (15 cases)</text>
  <rect x="400" y="678" width="300" height="18" rx="9" fill="#ffffff08"/>
  <rect x="400" y="678" width="219" height="18" rx="9" fill="#f59e0b"/>
  <text x="712" y="691" font-size="11" fill="#f59e0b">73%</text>

  <!-- Generation corruptions: 10 cases, 5 correct = 50% -->
  <text x="268" y="724" font-size="11" fill="#9ca3af">Generation (10 cases)</text>
  <rect x="400" y="712" width="300" height="18" rx="9" fill="#ffffff08"/>
  <rect x="400" y="712" width="150" height="18" rx="9" fill="#ef4444"/>
  <text x="712" y="725" font-size="11" fill="#ef4444">50%</text>

  <!-- Overall -->
  <text x="268" y="748" font-size="11" fill="#f9fafb" font-weight="600">Overall: 44/60 = 73.3%</text>
  <rect x="880" y="586" width="120" height="30" rx="8" fill="#22c55e15" stroke="#22c55e30" stroke-width="1"/>
  <text x="895" y="607" font-size="13" font-weight="700" fill="#22c55e">≥ 0.70 ✓</text>
</svg>
